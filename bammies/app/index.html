:root{--plum:#551A8B;--mute:#615C68;--rule:#E3E0E8;--strip:56px}
html,body{margin:0;height:100%;background:#0B0A0D}
.strip{position:fixed;top:0;left:0;right:0;height:calc(var(--strip) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:#FFFFFF;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:10;font-family:"Funnel Sans","Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}

.back:hover{text-decoration-thickness:2px}
.back:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
.back svg{flex:none}
.strip span{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
